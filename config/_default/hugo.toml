baseURL = "https://srinidhi.dev/"
locale = "en-US"
title = "Srinidhi Ramanujam"
theme = "PaperMod"
googleAnalytics = "G-MRKDHXM8CC"

enableRobotsTXT = true
ignoreFiles = ['(^|/)(_backups|scratch)(/|$)']

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[params]
  author = "Srinidhi Ramanujam"
  description = "Essays on AI engineering and short fiction by Srinidhi Ramanujam, an applied AI architect based in Bengaluru."
  keywords = ["applied AI", "GenAI", "production AI", "regulated enterprises", "evals", "RAG", "text-to-SQL", "data engineering"]
  images = ["social-card.png"]
  mainSections = ["writing", "fiction"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowToc = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  env = "production"

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#0d0c1a"
    msapplication_TileColor = "#0d0c1a"

  [params.footer]
    text = "[LinkedIn](https://www.linkedin.com/in/srinidhiramanujam/) · [GitHub](https://github.com/srinidhi621) · [Links](/links/) · [RSS](/index.xml)"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/srinidhiramanujam/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/srinidhi621"

[menu]
  [[menu.main]]
    name = "Essays"
    url  = "/writing/"
    weight = 10

  [[menu.main]]
    name = "Fiction"
    url  = "/fiction/"
    weight = 20

  [[menu.main]]
    name = "About"
    url  = "/about/"
    weight = 30
